name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '27.2'
          - '28.2'
          - '29.1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Byte-compile
        run: eldev compile --warnings-as-errors

      - name: Run tests
        run: eldev test

      - name: Lint
        run: eldev lint
        continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: '29.1'

      - name: Install Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Run tests with coverage
        run: eldev test --undercover
